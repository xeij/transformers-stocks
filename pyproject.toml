[project]
name = "stockbench"
version = "0.1.0"
description = "Walk-forward benchmark: do transformers beat strong baselines for short-horizon equity prediction?"
requires-python = ">=3.11,<3.12"
dependencies = [
  "numpy>=1.26",
  "pandas>=2.2",
  "pyarrow>=15",
  "scikit-learn>=1.4",
  "scipy>=1.12",
  "statsmodels>=0.14",
  "lightgbm>=4.3",
  "torch>=2.2",
  "yfinance>=0.2.40",
  "pyyaml>=6",
]

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.4"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/stockbench"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
filterwarnings = ["error::FutureWarning"]
